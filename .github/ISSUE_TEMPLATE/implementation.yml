name: Implementation task
description: Define a focused implementation outcome with detail proportional to risk.
title: "[M?-???] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a separate issue is useful. Low-risk documentation, tooling, metadata, scaffolding, mechanical refactors, and test-only fixes may use a concise pull request without a full issue.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the observable result in one or two sentences.
      placeholder: Add an executable world-server host that starts, reports healthy, and shuts down cleanly.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: Choose the highest risk actually affected by this change.
      options:
        - Low — docs, tooling, metadata, scaffolding, mechanical or test-only change
        - Medium — ordinary feature or subsystem work
        - High — persistence, concurrency, recovery, protocol, security, authority, economy, or architecture
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant context and constraints
      description: Link governing documents and state only constraints that materially affect implementation. Write None when unnecessary.
      placeholder: |
        Governed by docs/architecture.md.
        Preserve the standalone server boundary.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking work or write None. Optional for independent low-risk changes.
      placeholder: None
    validations:
      required: false

  - type: textarea
    id: behavior
    attributes:
      label: Required behavior or invariants
      description: Describe important behavior, interfaces, failure semantics, or invariants. Leave implementation choices open unless compatibility or safety requires precision.
      placeholder: |
        - Starts as a standalone .NET process.
        - Reports readiness after required dependencies initialize.
        - Shuts down without abandoning committed writes.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a small set of observable checks covering success and realistic material failures.
      placeholder: |
        - [ ] `dotnet build` succeeds.
        - [ ] Startup and graceful-shutdown tests pass.
        - [ ] The process reports healthy in the supported local environment.
    validations:
      required: true

  - type: dropdown
    id: human_required
    attributes:
      label: Human validation required
      description: Select Yes only when automated checks cannot adequately prove affected visible, interactive, import, export, or runtime behavior.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: human_validation
    attributes:
      label: Human validation
      description: When required, state the action and expected observation. Request screenshots or video only when they prove the criterion.
      placeholder: Open the project, perform the affected interaction, and confirm the expected visible result.
    validations:
      required: false

  - type: textarea
    id: stop_conditions
    attributes:
      label: Material stop conditions
      description: Optional. Include only unresolved architecture, dependency, contract, or significant scope-expansion conditions.
      placeholder: Stop if the change requires a new runtime dependency or changes the public protocol.
    validations:
      required: false
