name: Implementation task
description: Define a focused implementation outcome with detail proportional to risk.
title: "[M?-???] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a separate issue is useful. Low-risk documentation, tooling, metadata, scaffolding, mechanical refactors, and test-only fixes may use a concise pull request without a full issue.

        The implementation agent owns all command-line validation, including Windows PowerShell tasks invoked from WSL. Human involvement is limited to opening Godot and checking visible or interactive behavior.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the observable result in one or two sentences.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: Choose the highest risk actually affected.
      options:
        - Low — docs, tooling, metadata, scaffolding, mechanical or test-only change
        - Medium — ordinary feature or subsystem work
        - High — persistence, concurrency, recovery, protocol, security, authority, economy, or architecture
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant context and constraints
      description: Link governing documents and state only material constraints.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking work when applicable.
    validations:
      required: false

  - type: textarea
    id: behavior
    attributes:
      label: Required behavior or invariants
      description: Describe important behavior, interfaces, failure semantics, or invariants. Leave ordinary implementation choices open.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Automated acceptance criteria
      description: Use a small set of observable automated checks covering success and realistic material failures. Include PowerShell or Windows command-line checks here when needed; the agent will run them from WSL.
    validations:
      required: true

  - type: dropdown
    id: editor_required
    attributes:
      label: Editor check required
      description: Select Yes only when the merger must open Godot to inspect visible or interactive behavior that automation cannot adequately establish.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: textarea
    id: editor_check
    attributes:
      label: What should the merger inspect?
      description: When required, state only what to open and what to look for. Do not request screenshots, reports, environment details, SHA attestations, or copied command output.
    validations:
      required: false

  - type: textarea
    id: stop_conditions
    attributes:
      label: Material stop conditions
      description: Optional. Include only unresolved architecture, dependency, contract, or significant scope-expansion conditions.
    validations:
      required: false
